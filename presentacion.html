<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inteligencia Artificial, Herramientas y Futuro del Trabajo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Ink & paper system */
  --ink:#17171E;
  --paper:#F6F4EF;
  --paper-2:#EDEAE2;
  --muted:#5C5A66;
  --line:#E0DDD3;
  /* Per-class accents (cohesive, bold) */
  --c1:#E63946; /* Clase 1 · rojo */
  --c2:#F4A261; /* Clase 2 · naranja */
  --c3:#2A9D8F; /* Clase 3 · teal */
  --c4:#457B9D; /* Clase 4 · acero */
  --c5:#E76F51; /* Clase 5 · coral */
  --c6:#7C6A9E; /* Clase 6 · malva */
  --c7:#3A86FF; /* Clase 7 · azul */
  --c8:#8338EC; /* Clase 8 · púrpura */
  --c9:#FFBE0B; /* Clase 9 · ámbar */
  /* Aliases for existing references */
  --blue:var(--c7);
  --turq:var(--c3);
  --coral:var(--c5);
  --must:var(--c9);
  --purple:var(--c8);
  --ivory:var(--paper);
  --dark:var(--ink);
  --gray:var(--muted);
  --light-gray:var(--line);
  --radius:16px;
  --radius-sm:10px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.presentation{
  width:100%;
  max-width:1100px;
  height:100vh;
  max-height:700px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.slide-container{
  flex:1;
  position:relative;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:48px 56px;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .5s ease, transform .5s ease;
  pointer-events:none;
}
.slide.active{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.slide.exit{
  opacity:0;
  transform:translateY(-18px);
}

.slide-inner{
  width:100%;
  max-width:900px;
}

/* Typography */
h1,h2,h3,.card-title,.section-label,.class-badge,.step-num,.concept-circle{
  font-family:'Space Grotesk',sans-serif;
}
h1{font-size:2.7rem;font-weight:700;line-height:1.1;letter-spacing:-.03em;margin-bottom:16px}
h2{font-size:1.9rem;font-weight:600;line-height:1.15;letter-spacing:-.02em;margin-bottom:20px}
h3{font-size:1.25rem;font-weight:600;margin-bottom:10px}
.subtitle{font-size:1.15rem;font-weight:400;color:var(--muted);line-height:1.5;margin-bottom:8px}
.body-text{font-size:.98rem;font-weight:400;color:var(--muted);line-height:1.65}
.card-title{font-size:1.05rem;font-weight:600;margin-bottom:6px}

/* Navigation */
.nav-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 8px 8px;
  flex-shrink:0;
}

.nav-btn{
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:6px 14px;
  border-radius:20px;
  font-family:'Inter',sans-serif;
  font-size:.8rem;
  font-weight:500;
  color:var(--gray);
  transition:all .25s ease;
  letter-spacing:.01em;
}
.nav-btn:hover{color:var(--dark);background:rgba(0,0,0,.05)}
.nav-btn:active{transform:scale(.96)}
.nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.progress-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.progress-bar{
  width:180px;
  height:4px;
  background:var(--light-gray);
  border-radius:4px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(135deg,var(--blue),var(--turq));
  border-radius:4px;
  transition:width .4s ease;
}

.slide-num{
  font-size:.75rem;
  font-weight:500;
  color:var(--gray);
  letter-spacing:.04em;
  min-width:48px;
  text-align:center;
}

/* Decorative shapes */
.shape{position:absolute;pointer-events:none;z-index:0}
.shape-circle{
  border-radius:50%;
  opacity:.12;
}
.shape-rect{
  opacity:.07;
  border-radius:var(--radius);
}
.shape-line{
  height:2px;
  border-radius:2px;
  opacity:.1;
}

/* Card styles */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px 28px;
  box-shadow:0 1px 2px rgba(23,23,30,.04);
  transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(23,23,30,.06);border-color:var(--muted)}
.card-grid{display:grid;gap:16px}
.card-grid-2{grid-template-columns:1fr 1fr}
.card-grid-3{grid-template-columns:repeat(3,1fr)}
.card-grid-4{grid-template-columns:repeat(2,1fr)}

/* Badge / Tag */
.tag{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.tag-blue{background:rgba(37,99,235,.1);color:var(--blue)}
.tag-turq{background:rgba(20,184,166,.1);color:var(--turq)}
.tag-coral{background:rgba(255,107,107,.1);color:var(--coral)}
.tag-must{background:rgba(244,185,66,.1);color:#B8860B}
.tag-purple{background:rgba(139,92,246,.1);color:var(--purple)}

/* Step indicator */
.step-num{
  width:32px;height:32px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;
  color:white;flex-shrink:0;
}

/* Horizontal flow */
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flow-item{
  background:white;
  border-radius:var(--radius-sm);
  padding:16px 20px;
  text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  flex:1;min-width:140px;
}

/* Timeline */
.timeline-item{
  display:flex;gap:16px;
  align-items:flex-start;
  margin-bottom:12px;
}
.timeline-item:last-child{margin-bottom:0}

/* Key concept circle */
.concept-circle{
  width:80px;height:80px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:.85rem;
  text-align:center;line-height:1.2;
  margin-bottom:10px;
}

/* Animation classes */
.animate-in{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.animate-in.visible{opacity:1;transform:translateY(0)}
.delay-1{transition-delay:.1s}
.delay-2{transition-delay:.2s}
.delay-3{transition-delay:.3s}
.delay-4{transition-delay:.4s}
.delay-5{transition-delay:.5s}
.delay-6{transition-delay:.6s}

/* Cover specific */
.cover-slide{text-align:center;align-items:center}
.cover-slide h1{max-width:700px;margin-left:auto;margin-right:auto}
.cover-slide .cover-sub{
  max-width:500px;margin:0 auto;
}

/* Cover: una apertura clara con un acento visual amable */
.cover-slide.cover-hero{
  align-items:center;
  justify-content:center;
  padding:48px 56px;
  overflow:hidden;
  color:var(--ink);
  text-align:left;
  background:var(--paper);
}
.cover-hero::before{
  content:'';
  position:absolute;
  width:310px;
  height:310px;
  right:-125px;
  top:-145px;
  border:1px solid rgba(42,157,143,.16);
  border-radius:50%;
}
.cover-hero .slide-inner{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(230px,.8fr);
  align-items:center;
  gap:36px;
  max-width:940px;
}
.cover-copy{position:relative;z-index:2}
.cover-hero .section-label{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-bottom:20px;
  color:var(--c3)!important;
  font-size:.72rem;
}
.cover-hero .section-label::before{
  content:'';
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--c3);
  transform:rotate(45deg);
}
.cover-hero h1{
  max-width:620px;
  margin:0 0 18px;
  font-size:clamp(2.5rem,4.3vw,4.15rem);
  line-height:1.04;
  letter-spacing:-.05em;
  text-wrap:balance;
}
.cover-hero h1 span{color:var(--c3)}
.cover-hero .cover-sub{
  max-width:420px;
  margin:0;
  color:var(--muted);
  font-size:clamp(1rem,1.3vw,1.12rem);
  line-height:1.55;
}
.cover-art{
  position:relative;
  z-index:1;
  display:grid;
  min-height:330px;
  place-items:center;
}
.cover-art svg{width:min(100%,340px);overflow:visible}
.cover-art .orbit{transform-origin:180px 180px;animation:orbit-turn 54s linear infinite}
.cover-art .orbit:nth-child(2){animation-direction:reverse;animation-duration:68s}
.cover-art .art-label{
  position:absolute;
  right:0;
  bottom:4%;
  color:var(--muted);
  font-family:'Space Grotesk',sans-serif;
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.04em;
}
.cover-hero .shape{display:none}
@keyframes orbit-turn{to{transform:rotate(360deg)}}

/* Objective */
.obj-icon{
  width:56px;height:56px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
}

/* Class slide header */
.class-header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:28px;
}
.class-badge{
  width:52px;height:52px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:700;
  color:white;flex-shrink:0;
  box-shadow:0 3px 0 rgba(23,23,30,.15);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
}

/* Activity card */
.activity-card{
  background:var(--ink);
  color:white;
  border-radius:var(--radius);
  padding:28px 32px;
  position:relative;
  overflow:hidden;
}
.activity-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:5px;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8),var(--c9));
}
.activity-card h3{color:white}
.activity-card .body-text{color:rgba(255,255,255,.82)}

/* Reflection */
.reflection-card{
  border:2px solid;
  border-radius:var(--radius);
  padding:24px 28px;
}

/* Concept map */
.concept-map{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:16px;
}

/* Mini badge */
.mini-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:20px;
  font-size:.82rem;
  font-weight:500;
  background:rgba(0,0,0,.04);
}

/* Key hint */
.key-hint{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:28px;
  height:28px;
  padding:0 8px;
  border:1px solid var(--line);
  border-bottom-width:3px;
  border-radius:6px;
  background:var(--paper);
  font-family:'Space Grotesk',sans-serif;
  font-size:.85rem;
  font-weight:600;
  color:var(--ink);
}

/* Connector arrows */
.connector{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 0;
}

/* Section label */
.section-label{
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:6px;
}

/* List style */
.styled-list{list-style:none;padding:0}
.styled-list li{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:8px;
  font-size:.92rem;
  color:var(--muted);
  line-height:1.5;
}
.styled-list li::before{
  content:'';
  width:8px;height:8px;
  border-radius:50%;
  margin-top:6px;
  flex-shrink:0;
}
.list-dot{
  width:8px;height:8px;
  border-radius:50%;
  margin-top:6px;
  flex-shrink:0;
}

/* Example rows (slide 2 of class) */
.example-rows{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.example-row{
  display:flex;
  align-items:flex-start;
  gap:14px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:14px 18px;
  transition:transform .25s ease, border-color .25s ease;
}
.example-row:hover{transform:translateX(4px);border-color:var(--muted)}
.example-num{
  width:30px;height:30px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:700;font-size:.85rem;
  flex-shrink:0;
  font-family:'Space Grotesk',sans-serif;
}
.example-body{flex:1}

/* Big number backdrop */
.shape-num{
  position:absolute;
  font-family:'Space Grotesk',sans-serif;
  font-size:16rem;
  font-weight:700;
  line-height:1;
  opacity:.05;
  top:50%;
  right:6%;
  transform:translateY(-50%);
  pointer-events:none;
  z-index:0;
}

/* Comparison */
.comparison{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.comparison-left{
  background:rgba(37,99,235,.06);
  border-radius:var(--radius);
  padding:20px 24px;
}
.comparison-right{
  background:rgba(20,184,166,.06);
  border-radius:var(--radius);
  padding:20px 24px;
}

/* Responsive */
@media(max-width:768px){
  .slide{padding:32px 28px}
  h1{font-size:1.8rem}
  h2{font-size:1.4rem}
  .card-grid-2,.card-grid-3,.card-grid-4{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .flow-item{min-width:auto}
  .comparison{grid-template-columns:1fr}
  .nav-btn{padding:6px 10px;font-size:.72rem}
  .progress-bar{width:100px}
  .cover-slide.cover-hero{padding:32px 28px}
  .cover-hero .slide-inner{grid-template-columns:1fr;gap:0}
  .cover-hero h1{font-size:clamp(2.35rem,8vw,3.6rem)}
  .cover-art{position:absolute;inset:auto -6% -10% auto;width:36%;min-height:0;opacity:.22}
  .cover-art .art-label{display:none}
  .cover-hero .cover-sub{max-width:340px}
}

@media(max-width:480px){
  .cover-slide.cover-hero{padding:28px 22px}
  .cover-hero::before{
    width:210px;
    height:210px;
    right:-125px;
    top:-115px;
  }
  .cover-hero h1{font-size:clamp(2.15rem,10vw,3rem)}
  .cover-hero .section-label{margin-bottom:18px}
  .cover-art{position:absolute;width:24%;min-height:0;right:-3%;bottom:-21%;opacity:.14}
  .cover-hero .cover-sub{max-width:280px;font-size:.96rem}
}

@media(prefers-reduced-motion:reduce){
  .cover-art .orbit{animation:none}
}

/* Fade stagger children */
.stagger-children>*:not(.slide-inner){opacity:0;transform:translateY(10px);transition:opacity .45s ease, transform .45s ease}
.stagger-children>*:not(.slide-inner).visible{opacity:1;transform:translateY(0)}

/* Scrollbar hide */
::-webkit-scrollbar{display:none}

/* Focus */
.nav-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:20px}
</style>
</head>
<body>

<div class="presentation" id="presentation">
  <div class="slide-container" id="slideContainer"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="btnPrev" aria-label="Atrás" title="Atrás">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Atrás</span>
    </button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="slide-num" id="slideNum">01 / 00</span>
    </div>
    <button class="nav-btn" id="btnNext" aria-label="Adelante" title="Adelante">
      <span>Adelante</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script>
const slides = [];

// ===================== COVER =====================
slides.push({
  type:'cover',
  render(){
    return `<div class="slide cover-slide cover-hero active stagger-children">
      <div class="slide-inner">
        <div class="cover-copy">
          <div class="section-label animate-in delay-1">Curso · 9 clases</div>
          <h1 class="animate-in delay-2">Inteligencia Artificial,<br>Herramientas y<br>Futuro del Trabajo</h1>
          <p class="subtitle cover-sub animate-in delay-3">Aprendé a usar IA como parte de tu proceso creativo y profesional.</p>
        </div>
        <div class="cover-art animate-in delay-3" aria-hidden="true">
          <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g class="orbit" stroke="rgba(42,157,143,.42)" stroke-width="1.5">
              <ellipse cx="180" cy="180" rx="145" ry="58" transform="rotate(-38 180 180)"/>
            </g>
            <g class="orbit" stroke="rgba(23,23,30,.2)" stroke-width="1.5">
              <ellipse cx="180" cy="180" rx="145" ry="58" transform="rotate(38 180 180)"/>
            </g>
            <circle cx="180" cy="180" r="78" fill="#EDEAE2"/>
            <circle cx="180" cy="180" r="68" stroke="#2A9D8F" stroke-opacity=".38" stroke-width="1.5" stroke-dasharray="2 8"/>
            <path d="M180 128L192 165L231 165L199 188L211 225L180 202L149 225L161 188L129 165L168 165L180 128Z" fill="#2A9D8F"/>
            <circle cx="300" cy="102" r="7" fill="#FFBE0B"/>
            <circle cx="65" cy="252" r="5" fill="#E76F51"/>
            <rect x="278" y="278" width="12" height="12" transform="rotate(45 278 278)" fill="#457B9D"/>
          </svg>
          <span class="art-label">Curiosidad · criterio · creación</span>
        </div>
      </div>
    </div>`
  }
});

// ===================== OBJETIVO =====================
slides.push({
  type:'objective',
  render(){
    return `<div class="slide stagger-children">
      <div class="slide-inner">
        <div class="animate-in delay-1"><h2>🎯 Objetivo del curso</h2>
          <p class="subtitle">Comprender, experimentar y aplicar herramientas de IA en tu vida profesional y personal.</p>
        </div>
        <div class="card-grid card-grid-3" style="margin-top:28px">
          <div class="card animate-in delay-2">
            <div class="obj-icon" style="background:rgba(58,134,255,.12)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c7)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>
            </div>
            <h3 class="card-title">Comprender</h3>
            <p class="body-text">Entender cómo funciona la IA, qué puede y qué no puede hacer.</p>
          </div>
          <div class="card animate-in delay-3">
            <div class="obj-icon" style="background:rgba(42,157,143,.12)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c3)" stroke-width="2" stroke-linecap="round"><path d="M12 2l2.5 7h7l-5 4 2 7-6-5-6 5 2-7-5-4h7z"/></svg>
            </div>
            <h3 class="card-title">Experimentar</h3>
            <p class="body-text">Probar herramientas reales con ejercicios guiados paso a paso.</p>
          </div>
          <div class="card animate-in delay-4">
            <div class="obj-icon" style="background:rgba(131,56,236,.12)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--c8)" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9v-4l8-8-4-2z"/></svg>
            </div>
            <h3 class="card-title">Aplicar</h3>
            <p class="body-text">Integrar IA en tus flujos de trabajo con confianza y criterio.</p>
          </div>
        </div>
        <div class="card animate-in delay-5" style="margin-top:20px;text-align:center;background:rgba(255,190,11,.1);border-color:rgba(255,190,11,.3)">
          <p class="body-text" style="font-size:1.05rem;font-weight:500;color:var(--ink)">💡 No necesitas ser experto. Solo curiosidad y ganas de explorar.</p>
        </div>
      </div>
      <div class="shape shape-circle" style="width:250px;height:250px;background:var(--c5);bottom:-60px;right:30px;opacity:.07"></div>
    </div>`
  }
});

// ===================== EVOLUCIÓN =====================
slides.push({
  type:'evolution',
  render(){
    const colors=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)','var(--c9)'];

// ===================== RENDER ENGINE =====================
let currentSlide = 0;
const totalSlides = renderSlides.length;
const container = document.getElementById('slideContainer');
const progressFill = document.getElementById('progressFill');
const slideNum = document.getElementById('slideNum');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

// Build all slide elements
renderSlides.forEach((s) => {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = s.render();
  const slideEl = wrapper.firstElementChild;
  if (slideEl) container.appendChild(slideEl);
});

const slideElements = container.querySelectorAll('.slide');

function updateSlide(index) {
  slideElements.forEach((el, i) => {
    el.classList.remove('active', 'exit');
    if (i === index) {
      el.classList.add('active');
      // Trigger animations
      setTimeout(() => {
        el.querySelectorAll('.animate-in').forEach(a => {
          a.classList.add('visible');
        });
      }, 50);
    } else if (i < index) {
      el.classList.add('exit');
    }
  });

  progressFill.style.width = ((index + 1) / totalSlides * 100) + '%';
  slideNum.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(totalSlides).padStart(2, '0');

  btnPrev.style.opacity = index === 0 ? '0.3' : '1';
  btnNext.style.opacity = index === totalSlides - 1 ? '0.3' : '1';
  btnPrev.style.cursor = index === 0 ? 'not-allowed' : 'pointer';
  btnNext.style.cursor = index === totalSlides - 1 ? 'not-allowed' : 'pointer';
}

function nextSlide() {
  if (currentSlide < totalSlides - 1) {
    slideElements[currentSlide].classList.remove('active');
    slideElements[currentSlide].querySelectorAll('.animate-in').forEach(a => a.classList.remove('visible'));
    currentSlide++;
    updateSlide(currentSlide);
  }
}

function prevSlide() {
  if (currentSlide > 0) {
    slideElements[currentSlide].classList.remove('active');
    slideElements[currentSlide].querySelectorAll('.animate-in').forEach(a => a.classList.remove('visible'));
    currentSlide--;
    updateSlide(currentSlide);
  }
}

btnNext.addEventListener('click', nextSlide);
btnPrev.addEventListener('click', prevSlide);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// Touch support
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) nextSlide();
    else prevSlide();
  }
});

// Initialize
updateSlide(0);
